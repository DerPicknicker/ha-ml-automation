name: Release

# Run manually with the version to publish. Runs the tests, writes the version
# into manifest.json, tags the commit and publishes a GitHub release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      MANIFEST: custom_components/ml_automation/manifest.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Run the tests
        run: |
          pip install -r requirements_test.txt
          python -m pytest -q

      - name: Write the version into the manifest
        run: |
          python - <<'PY'
          import json, os
          path = os.environ["MANIFEST"]
          with open(path, encoding="utf-8") as file:
              manifest = json.load(file)
          manifest["version"] = os.environ["VERSION"]
          with open(path, "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2, ensure_ascii=False)
              file.write("\n")
          PY

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "$MANIFEST"; then
            git commit -m "Release v$VERSION" -- "$MANIFEST"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build the zip
        run: |
          cd custom_components/ml_automation
          zip -r "$GITHUB_WORKSPACE/ml_automation.zip" . -x "*/__pycache__/*" "*.pyc"

      - name: Publish the release
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" ml_automation.zip \
            --title "v$VERSION" --generate-notes $prerelease
