name: Feature request
description: Suggest something the integration should be able to do.
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is this about?
      options:
        - Learning / the model
        - Switching on and off
        - Detecting activity / learning data
        - Setup and options
        - Entities and dashboard
        - Documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: What is the situation in your home?
      description: Describe the problem before the solution. Which devices and entities are involved, what happens today, and what should happen?
      placeholder: |
        My heating valve (climate.living_room) should follow when we are usually home, but ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the integration to do?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Concrete example
      description: Walk through one day with times, so it is clear what "correct" looks like.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
      description: An automation, another integration, doing it by hand ...
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this yourself?
      options:
        - "No"
        - Yes, with some guidance
        - Yes, I will open a pull request
    validations:
      required: true
